sonar.projectKey=PCQ
sonar.projectName=PCQ :: frontend
sonar.projectVersion=1.0.0

sonar.sources=app
sonar.tests=test
sonar.language=js
sonar.exclusions=app/assets/**, app/**/template.html, app/**/*.njk, app/healthcheck.js, app/components/app-insights.js, app/**/scripts.html
sonar.dynamicAnalysis=reuseReports
sonar.cpd.exclusions=app/steps/**, app/journeys/**
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2699
sonar.issue.ignore.multicriteria.e1.resourceKey=test/component/**/*.js test/component/*.js
sonar.issue.ignore.multicriteria=e2
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:S6706
sonar.issue.ignore.multicriteria.e2.resourceKey=app/resources/localhost-ssl/localhost.key

sonar.javascript.lcov.reportPaths=functional-output/coverage/lcov.info
